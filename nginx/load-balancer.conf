# ==============================================================================
# SamayYudh 2.0 — Production Load Balancer Configuration (Nginx Reverse Proxy)
# Architecture: Multi-node upstream with least-connections balancing & health checks
# ==============================================================================

# Rate limiting zones to prevent DDOS / API hammering at the network edge
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ai_eval_limit:10m rate=5r/s;

# Upstream cluster pool containing Next.js application nodes
upstream samayyudh_cluster {
    # least_conn routes new requests to the node with the fewest active connections
    least_conn;

    server app1:3000 max_fails=3 fail_timeout=10s weight=5;
    server app2:3000 max_fails=3 fail_timeout=10s weight=5;
    server app3:3000 max_fails=3 fail_timeout=10s weight=5;

    # Keepalive idle connections to reduce TCP handshake latency between LB and nodes
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Client body and buffer limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression for fast delivery across nodes
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security & Cluster Tracking Headers
    add_header X-Load-Balancer "SamayYudh-NGINX-Edge" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Upstream Health Check Route for Cloud Monitors / Root LB
    location /lb-status {
        access_log off;
        return 200 '{"status":"operational","balancer":"nginx-least-conn","upstream":"samayyudh_cluster"}';
        add_header Content-Type application/json;
    }

    # Health check passthrough to application nodes
    location = /api/health {
        proxy_pass http://samayyudh_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # High-intensity AI evaluation rate limiting
    location ~* ^/api/(evaluate|gemini|sokha) {
        limit_req zone=ai_eval_limit burst=10 nodelay;

        proxy_pass http://samayyudh_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Longer timeout for streaming AI evaluations
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # General API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://samayyudh_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Next.js Static Assets & PWA chunks (Direct caching bypasses upstream load)
    location /_next/static/ {
        proxy_pass http://samayyudh_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Default proxy to Next.js App Cluster
    location / {
        proxy_pass http://samayyudh_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}
