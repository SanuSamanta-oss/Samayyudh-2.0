<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — সময়যুদ্ধ 2.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #fff;
      font-family: 'Arvo', serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1c1917;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .page_404 {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }
    .four_zero_four_bg {
      background-image: url(/dribbble_1.gif);
      height: 400px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .four_zero_four_bg h1 {
      font-size: clamp(52px, 12vw, 80px);
      font-weight: 700;
      color: #1c1917;
    }
    .contant_box_404 {
      margin-top: -50px;
    }
    .contant_box_404 h3 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 700;
      margin-bottom: 12px;
      color: #1c1917;
    }
    .contant_box_404 p {
      font-size: 16px;
      color: #57534e;
      max-width: 480px;
      margin: 0 auto 20px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    .link_404 {
      color: #fff !important;
      padding: 12px 28px;
      background: #39ac31;
      font-weight: 700;
      font-size: 14px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
    }
    .link_404:hover {
      background: #329c2b;
    }
    .link_404:active {
      transform: scale(0.97);
    }
    .btn_home {
      padding: 12px 24px;
      color: #57534e;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 6px;
      background: #f5f5f4;
      display: inline-block;
    }
    .btn_home:hover {
      background: #e7e5e4;
      color: #1c1917;
    }
    .footer_note {
      margin-top: 32px;
      font-size: 12px;
      color: #a8a29e;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <section class="page_404">
    <div class="four_zero_four_bg">
      <h1>404</h1>
    </div>
    <div class="contant_box_404">
      <h3>Look like you're offline</h3>
      <p>The page you are looking for is not available because your network connection is offline!</p>
      <div class="actions">
        <button class="link_404" onclick="window.location.reload()">Retry Connection</button>
        <a href="/" class="btn_home">Go to Home</a>
      </div>
      <div class="footer_note">
        সময়যুদ্ধ 2.0 • Offline Network Mode
      </div>
    </div>
  </section>
  <script>
    // Auto-reload when network reconnects
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
