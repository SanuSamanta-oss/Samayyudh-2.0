version: '3.8'

# ==============================================================================
# SamayYudh 2.0 — Multi-Node Cluster with Nginx Load Balancer & Upstash Redis
# Run with: docker-compose -f docker-compose.load-balancer.yml up --build -d
# ==============================================================================

services:
  # --- Layer 1: Nginx Edge Load Balancer ---
  load-balancer:
    image: nginx:alpine
    container_name: samayyudh-load-balancer
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - samayyudh-cluster

  # --- Layer 2: Next.js Replicated Application Nodes ---
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samayyudh-node-1
    restart: always
    environment:
      - PORT=3000
      - NODE_ID=cluster-node-1
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - samayyudh-cluster

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samayyudh-node-2
    restart: always
    environment:
      - PORT=3000
      - NODE_ID=cluster-node-2
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - samayyudh-cluster

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samayyudh-node-3
    restart: always
    environment:
      - PORT=3000
      - NODE_ID=cluster-node-3
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - samayyudh-cluster

networks:
  samayyudh-cluster:
    driver: bridge

